<!DOCTYPE html>
<html>
<head>
	<title>Gazebo Terrain Generator</title>
	<meta charset="utf-8"/>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />

	<!-- TODO replace jquery with react -->
	<script src="jquery.min.js"></script> 

<script src='https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js'></script>
	<link href='https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css' rel='stylesheet' />

	<!-- Geocoder disabled to prevent warnings -->
	
	<!-- Use proven working Mapbox GL Draw -->
	<script src='https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.3/mapbox-gl-draw.js'></script>
	<link rel='stylesheet' href='https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.3/mapbox-gl-draw.css' type='text/css'/>
	
	<!-- Skip rectangle plugin for now - use polygon instead -->
	<!-- <script src='mapbox-gl-draw-rectangle-mode.min.js'></script> -->

	<script src='https://rawgit.com/kimmobrunfeldt/progressbar.js/1.0.0/dist/progressbar.js'></script>

	<script src="async.min.js"></script>
	<script src="turf.min.js"></script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
	<script src="materialize/js/materialize.min.js"></script>
	<link href='materialize/css/materialize.min.css' rel='stylesheet' type='text/css' />

	<script src="main.js"></script>
	<link href='fonts/fonts.css' rel='stylesheet' type='text/css' />
	<link href='style.css' rel='stylesheet' type='text/css' />
	<link rel="stylesheet" href="css/centerPoint.css">
</head>
<body>

	<div id='max-height'>
		
		<div id='map-view'></div>

		<div id='main-title'>Gazebo Terrain Generator</div>

	</div>

	<div class='sidebar' id='main-sidebar'>

		<div class='step-number'>
			1
		</div>
		<div class="step-title">
			Search an Area
		</div>

		<form id='search-form' class='sidebar-section row'>
			<div class="input-field col s12">
				<input id="location-box" name="location" type="text" value="New York" />
				<label for="location-box">Enter a location</label>
			</div>
		</form>


		<div class='step-number'>
			2
		</div>
		<div class="step-title">
			Select a Region
		</div>

		<div class='center-align sidebar-section'>
			<p>
				<a class="btn btn-primary btn-small" id='rectangle-draw-button'>Draw Region</a>
			</p>
		</div>

		<!-- Center Point Coordinates -->
		<div class='sidebar-section' id='coordinates-section' style="display: none;">
			<div class="step-title" style="font-size: 0.9em; margin-bottom: 10px;">Center Point</div>
			<div id='coordinates'>
				<p style="margin: 5px 0; font-size: 0.85em;">Latitude: <span id="point-lat">--</span></p>
				<p style="margin: 5px 0; font-size: 0.85em;">Longitude: <span id="point-lng">--</span></p>
			</div>
		</div>

		<div class='step-number'>
			3
		</div>
		<div class="step-title">
			Configure
		</div>

		<div class='sidebar-section'>
			<div class="row">
				<div class="input-field col s6">
					<input id="zoom-from-box" name="zoom-level" type="text" value='17'/>
					<label for="zoom-from-box" class="active">Zoom level:</label>
				</div>
			</div>


			<div class="row">
				<div class="input-field col s10">
					<input id="source-box" name="tile-source" type="text" value='https://tile.openstreetmap.org/{z}/{x}/{y}.png'>
					<label for="source-box">Map Tile Source</label>
				</div>
				<div class="input-field col s2">
					<a class='btn btn-secondary dropdown-trigger' id='source-select' href='#' data-target='sources'>⯆</a>

					<ul id='sources' class='dropdown-content'>
					</ul>
				</div>
			</div>

			<div class='center-align'>
				<a class="btn btn-secondary btn-small" id='grid-preview-button'>Preview Grid</a>
			</div>

		</div>

		<div class='step-number'>
			4
		</div>

		<div class="step-title">
			Output Settings
		</div>

		<div class='sidebar-section'>

			<div class="input-field col s12">
				<input id="output-directory-box" name="model-name" type="text" value="{timestamp}">
				<label for="output-directory-box">Model name</label>
			</div>


			<div class="input-field col s12">
				<input id="parallel-threads-box" name="parallel-downloads" type="text" value="4">
				<label for="parallel-threads-box">Parallel downloads</label>
			</div>
		</div>

		<button class='btn btn-primary btn-large bottom-button' id='download-button'>Generate Terrain</button>

	</div>

	<div class='sidebar' id='download-sidebar' style="display: none;">

		<div class='step-number'>
			5
		</div>
		<div class="step-title">
			Generating World
		</div>
		<div class="hints sidebar-section">
			Please wait...
		</div>

		<div class="sidebar-section">
			<div id='progress-radial' class=''>
	
			</div>
	
			<p id='progress-subtitle' class=''>
	
			</p>
	
			<p class='tile-strip '>
			</p>

		</div>
	
		<textarea id='log-view' name='log-output' class="sidebar-section"></textarea>

		<button class='waves-effect waves-light z-depth-0 btn-large red lighten-5 bottom-button' id='stop-button'>Stop</button>

	</div>

	<script src="js/centerPoint.js"></script>
	<!-- Center point initialization moved to main.js after map is ready -->

	<link href='https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.css' rel='stylesheet' />
    <style>
        .maplibregl-marker {
            cursor: move;
        }
    </style>
</body>
</html>
